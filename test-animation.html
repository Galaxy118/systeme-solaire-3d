<!DOCTYPE html>
<html>
<head>
    <title>Test Animation</title>
    <style>
        body { margin: 0; font-family: monospace; }
        #debug { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: lime; padding: 10px; z-index: 9999; }
    </style>
</head>
<body>
    <div id="debug">Debug Console</div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        
        const debug = document.getElementById('debug');
        function log(msg) {
            debug.innerHTML += '<br>' + msg;
        }
        
        log('Testing animation...');
        
        // Test easing functions
        const EASING = {
            easeInCubic: (t) => t * t * t,
            easeInOutCubic: (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
            easeOutCubic: (t) => 1 - Math.pow(1 - t, 3)
        };
        
        log('Easing test: easeInCubic(0.5) = ' + EASING.easeInCubic(0.5));
        
        // Test progress calculator
        function calculateCinematicProgress(elapsed) {
            const duration = 7000;
            const progress = Math.min(elapsed / duration, 1);
            
            let phase, phaseProgress, easedProgress;
            
            if (progress < 0.286) {
                phase = 1;
                phaseProgress = progress / 0.286;
                easedProgress = EASING.easeInCubic(phaseProgress);
            } else if (progress < 0.714) {
                phase = 2;
                phaseProgress = (progress - 0.286) / 0.428;
                easedProgress = 0.2 + (EASING.easeInOutCubic(phaseProgress) * 0.6);
            } else {
                phase = 3;
                phaseProgress = (progress - 0.714) / 0.286;
                easedProgress = 0.8 + (EASING.easeOutCubic(phaseProgress) * 0.2);
            }
            
            return { progress, phase, phaseProgress, easedProgress };
        }
        
        // Test at different times
        [0, 1000, 2000, 3500, 5000, 6000, 7000].forEach(t => {
            const result = calculateCinematicProgress(t);
            log(`t=${t}ms: phase=${result.phase}, eased=${result.easedProgress.toFixed(3)}`);
        });
        
        // Test camera positions
        const startPos = { x: 0, y: 300, z: 500 };
        const endPos = { x: 80, y: 60, z: 120 };
        
        [0, 0.2, 0.5, 0.8, 1.0].forEach(eased => {
            const x = startPos.x + (endPos.x - startPos.x) * eased;
            const y = startPos.y + (endPos.y - startPos.y) * eased;
            const z = startPos.z + (endPos.z - startPos.z) * eased;
            log(`eased=${eased.toFixed(1)}: camera=(${x.toFixed(0)}, ${y.toFixed(0)}, ${z.toFixed(0)})`);
        });
    </script>
</body>
</html>
