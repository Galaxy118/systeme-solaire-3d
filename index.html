<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système Solaire 3D</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Écran d'introduction -->
    <div id="intro-screen">
        <div class="intro-content">
            <div class="stars-bg"></div>
            <h1 class="intro-title">
                <span class="letter">S</span><span class="letter">Y</span><span class="letter">S</span><span class="letter">T</span><span class="letter">È</span><span class="letter">M</span><span class="letter">E</span>
                <br>
                <span class="letter">S</span><span class="letter">O</span><span class="letter">L</span><span class="letter">A</span><span class="letter">I</span><span class="letter">R</span><span class="letter">E</span>
            </h1>
            <p class="intro-subtitle">Explorez l'univers en 3D</p>
            <button id="start-btn">
                <span>Commencer l'exploration</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="container"></div>

    <!-- Bouton menu (3 tirets) -->
    <button id="menu-toggle" class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Menu latéral (Vitesse + Options) -->
    <div id="side-menu" class="side-menu">
        <div class="side-menu-section">
            <h3 class="side-menu-title">VITESSE</h3>
            <span class="speed-label">Multiplicateur</span>
            <span id="speed-display" class="speed-value">1×</span>
            <div class="speed-btns">
                <button id="speed-down">-</button>
                <button id="speed-up">+</button>
            </div>
        </div>

        <div class="side-menu-divider"></div>

        <div class="side-menu-section">
            <h3 class="side-menu-title">OPTIONS</h3>
            <button id="toggle-orbits" class="hud-toggle active">
                <span class="toggle-dot"></span>ORBITES
            </button>
            <button id="toggle-labels" class="hud-toggle active">
                <span class="toggle-dot"></span>LABELS
            </button>
            <button id="toggle-velocity" class="hud-toggle">
                <span class="toggle-dot"></span>VITESSE
            </button>
        </div>
    </div>

    <!-- Overlay pour fermer le menu quand on clique à côté -->
    <div id="menu-overlay" class="menu-overlay"></div>

    <!-- Fenêtre plein écran info planète -->
    <div id="planet-info-fullscreen" class="planet-info-fullscreen">
        <button id="close-planet-info" class="close-planet-info">✕</button>
        <div id="planet-info-content" class="planet-info-content">
            <!-- Contenu dynamique -->
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
